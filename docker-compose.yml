services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clouddev-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/clouddev?sslmode=disable"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: clouddev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clouddev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clouddev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
